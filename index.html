        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .char-input {
            width: 100%;
            padding: 0.75rem 0.25rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            background: white;
            ime-mode: disabled;
        }
        .char-input:focus {
            border-color: #6366f1;
            outline: none;
            background: #f8fafc;
        }
        .correct-input { border-color: #10b981 !important; background-color: #ecfdf5; }
        .wrong-input { border-color: #ef4444 !important; background-color: #fef2f2; }

    /* フィードバックアニメーション */
    @keyframes feedback-pop {
        0%   { transform: scale(0.5) translateY(10px); opacity: 0; }
        60%  { transform: scale(1.15) translateY(-4px); opacity: 1; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%       { transform: translateX(-8px); }
        40%       { transform: translateX(8px); }
        60%       { transform: translateX(-6px); }
        80%       { transform: translateX(6px); }
    }
    .feedback-correct {
        animation: feedback-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .feedback-wrong {
        animation: shake 0.4s ease forwards;
    }

    /* 結果画面アニメーション */
    @keyframes result-in {
        0%   { transform: scale(0.7) translateY(30px); opacity: 0; }
        70%  { transform: scale(1.05) translateY(-5px); opacity: 1; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes score-count {
        0%   { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    @keyframes confetti-fall {
        0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(120px) rotate(720deg); opacity: 0; }
    }
    .result-animate {
        animation: result-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .score-animate {
        animation: score-count 0.4s ease 0.3s both;
    }
    .message-animate {

    // 全問モード専用スコアメッセージ (59問満点基準)
    function getFullModeMessage(score) {
        if (score === 0)  return "舐めてんのか？";
        if (score <= 20)  return "チョベリバ";
        if (score <= 35)  return "全然、勉強が足りてない";
        if (score <= 46)  return "まさかこの程度で良いと思ってる？";
        if (score <= 57)  return "どうせなら全部覚えてくれよ";
        if (score === 58) return "なんで逆に一問間違えるんだよ！";
        return "遂に来たね、\"コッチ側\"に...";
    }

    class QuizApp {
        constructor() {
            this.history = JSON.parse(localStorage.getItem('verb_history_v2') || '[]');
            this.ranking = JSON.parse(localStorage.getItem('verb_ranking_v2') || '[]');
            this.currentQuiz = [];
            this.currentIndex = 0;
            this.score = 0;
            this.isFullMode = false;
            
            this.ui = {
                menu: document.getElementById('menu'),
                quiz: document.getElementById('quiz-area'),
                result: document.getElementById('result-area'),
                modal: document.getElementById('modal-overlay'),
                modalContent: document.getElementById('modal-content'),
                jp: document.getElementById('japanese-word'),
                feedback: document.getElementById('feedback'),
                status: document.getElementById('quiz-status'),
                progress: document.getElementById('progress-bar'),
                score: document.getElementById('score-display'),
                message: document.getElementById('score-message'),
                submitBtn: document.getElementById('submit-btn'),
                containers: {
                    present: document.getElementById('container-present'),
                    past: document.getElementById('container-past'),
                    pp: document.getElementById('container-pp')
                }
            };
        }

        createInputRow(containerId, word) {
            const container = this.ui.containers[containerId];
            container.innerHTML = '';
            const maxLen = 15;
            for (let i = 0; i < maxLen; i++) {
                const input = document.createElement('input');
                input.type = "text";
                input.className = "char-input w-8 md:w-10";
                input.maxLength = 1;
                input.setAttribute('autocomplete', 'off');
                input.setAttribute('autocorrect', 'off');
                input.setAttribute('autocapitalize', 'none');
                input.setAttribute('spellcheck', 'false');
                input.setAttribute('inputmode', 'email');

                input.oninput = (e) => {
                    const val = e.target.value.toLowerCase();
                    if (!/^[a-z/]$/.test(val)) { e.target.value = ''; return; }
                    if (val && i < maxLen - 1) container.children[i+1].focus();
                };
                input.onkeydown = (e) => {
                    if (e.key === 'Backspace' && !e.target.value && i > 0) container.children[i-1].focus();
                    if (e.key === 'Enter') this.handleEnter(containerId);
                };
                container.appendChild(input);
            }
        }

        handleEnter(containerId) {
            if (containerId === 'present') this.ui.containers.past.children[0].focus();
            else if (containerId === 'past') this.ui.containers.pp.children[0].focus();
            else this.checkAnswer();
        }

        getWordFromInputs(containerId) {
            return Array.from(this.ui.containers[containerId].children).map(i => i.value).join('').trim();
        }

        startFullMode() {
            this.isFullMode = true;
            const pool = [...VERB_DATA].sort(() => Math.random() - 0.5);
            this.generateQuiz(pool, pool.length);
        }

        showCountDialog() {
            this.showModal(`
                <h3 class="text-xl font-bold mb-4">問題数指定</h3>
                <input type="number" id="quiz-count-input" value="10" min="1" max="59" class="w-full p-4 border-2 rounded-xl text-2xl font-bold text-center mb-4">
                <button onclick="quizApp.startCustomCount()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold text-lg">開始</button>
            `);
        }

        startCustomCount() {
            const count = parseInt(document.getElementById('quiz-count-input').value) || 10;
            this.closeModal();
            this.isFullMode = false;
            const pool = [...VERB_DATA].sort(() => Math.random() - 0.5);
            this.generateQuiz(pool, count);
        }

        startMistakeMode() {
            const stats = this.getMistakeStats();
            const indices = Object.keys(stats).map(Number);
            if (indices.length === 0) {
                this.showModal('<p class="p-8 text-center font-bold">間違い履歴がありません。</p>');
                return;
            }
            this.isFullMode = false;
            const pool = indices.sort((a, b) => stats[b] - stats[a]).map(idx => VERB_DATA[idx]);
            this.generateQuiz(pool, pool.length);
        }

        getMistakeStats() {
            return this.history.reduce((acc, curr) => {
                if (!curr.isCorrect) acc[curr.verbIndex] = (acc[curr.verbIndex] || 0) + 1;
                return acc;
            }, {});
        }

        generateQuiz(pool, count) {
            this.currentQuiz = pool.slice(0, count).map(v => ({
                verbIndex: VERB_DATA.findIndex(orig => orig.ja === v.ja), ...v
            }));
            this.currentIndex = 0;
            this.score = 0;
            this.ui.menu.classList.add('hidden');
            this.ui.quiz.classList.remove('hidden');
            this.showQuestion();
        }

        showQuestion() {
            const q = this.currentQuiz[this.currentIndex];
            this.ui.jp.innerText = q.ja;
            this.ui.feedback.innerHTML = "";
            this.ui.status.innerText = `Question ${this.currentIndex + 1} / ${this.currentQuiz.length}`;
            this.ui.progress.style.width = `${(this.currentIndex / this.currentQuiz.length) * 100}%`;
            this.createInputRow('present', q.present);
            this.createInputRow('past', q.past);
            this.createInputRow('pp', q.pp);
            this.ui.containers.present.children[0].focus();
            this.ui.submitBtn.innerText = "回答";
            this.ui.submitBtn.onclick = () => this.checkAnswer();
        }

        checkAnswer() {
            const q = this.currentQuiz[this.currentIndex];
            const uPresent = this.getWordFromInputs('present');
            const uPast = this.getWordFromInputs('past');
            const uPP = this.getWordFromInputs('pp');

            const check = (user, actual) => {
                const alts = actual.toLowerCase().split('/').map(s => s.trim());
                return alts.includes(user.toLowerCase());
            };

            const pOk = check(uPresent, q.present);
            const paOk = check(uPast, q.past);
            const ppOk = check(uPP, q.pp);
            const allOk = pOk && paOk && ppOk;

            // 入力欄に色付け
            this.colorInputs('present', uPresent, q.present, pOk);
            this.colorInputs('past', uPast, q.past, paOk);
            this.colorInputs('pp', uPP, q.pp, ppOk);

            if (allOk) {
                this.score++;
                this.ui.feedback.innerHTML = `<span class="feedback-correct inline-block text-green-500 font-black" style="font-size:3rem;">✓ 正解！</span>`;
            } else {
                const ans = `${q.present} - ${q.past} - ${q.pp}`;
                this.ui.feedback.innerHTML = `<span class="feedback-wrong inline-block text-red-500 font-black" style="font-size:3rem;">✗ 不正解</span><br><span class="text-base text-slate-600 mt-1 inline-block">正解: <strong>${ans}</strong></span>`;
            }

            this.history.push({ verbIndex: q.verbIndex, isCorrect: allOk, ts: Date.now() });
            localStorage.setItem('verb_history_v2', JSON.stringify(this.history));

            this.ui.submitBtn.innerText = this.currentIndex < this.currentQuiz.length - 1 ? "次へ →" : "結果を見る";
            this.ui.submitBtn.onclick = () => this.nextQuestion();
        }

        colorInputs(containerId, userWord, actual, isOk) {
            const container = this.ui.containers[containerId];
            const correctWord = actual.split('/')[0].trim(); // 表示用は最初の候補
            Array.from(container.children).forEach((inp, i) => {
                if (i < userWord.length || i < correctWord.length) {
                    inp.classList.add(isOk ? 'correct-input' : 'wrong-input');
                    if (!isOk && i < correctWord.length) inp.value = correctWord[i];
                }
            });
        }

        nextQuestion() {
            this.currentIndex++;
            if (this.currentIndex >= this.currentQuiz.length) {
                this.showResult();
            } else {
                this.showQuestion();
            }
        }

        showResult() {
            this.ui.quiz.classList.add('hidden');
            this.ui.result.classList.remove('hidden');
            const total = this.currentQuiz.length;

            let message;
            if (this.isFullMode) {
                message = getFullModeMessage(this.score);
            } else {
                const pct = total > 0 ? this.score / total : 0;
                if (pct === 1)        message = "満点！完璧です！🎉";
                else if (pct >= 0.8)  message = "素晴らしい！あと少し！";
                else if (pct >= 0.6)  message = "まずまず。復習しよう！";
                else                  message = "もっと練習が必要です。";
            }

            // アニメーション付きで表示
            const resultCard = this.ui.result;
            resultCard.classList.add('result-animate');
            setTimeout(() => resultCard.classList.remove('result-animate'), 600);

            this.ui.score.classList.remove('score-animate');
            void this.ui.score.offsetWidth; // reflow
            this.ui.score.classList.add('score-animate');
            this.ui.score.innerText = `${this.score} / ${total}`;

            this.ui.message.classList.remove('message-animate');
            void this.ui.message.offsetWidth;
            this.ui.message.classList.add('message-animate');
            this.ui.message.innerText = message;

            // 全問正解時は紙吹雪
            if (this.isFullMode && this.score === total) {
                this.launchConfetti();
            }

            // ランキング保存
            this.ranking.push({ score: this.score, total, ts: Date.now() });
            this.ranking.sort((a, b) => (b.score / b.total) - (a.score / a.total));
            this.ranking = this.ranking.slice(0, 10);
            localStorage.setItem('verb_ranking_v2', JSON.stringify(this.ranking));
        }

        launchConfetti() {
            const colors = ['#6366f1','#10b981','#f59e0b','#ef4444','#3b82f6','#ec4899'];
            const container = this.ui.result;
            for (let i = 0; i < 40; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.top = '-10px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = (Math.random() * 0.8) + 's';
                piece.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 2000);
            }
        }

        exitToMenu() {
            this.ui.quiz.classList.add('hidden');
            this.ui.result.classList.add('hidden');
            this.ui.menu.classList.remove('hidden');
        }

        showAnalysis() {
            const stats = this.getMistakeStats();
            const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
            if (entries.length === 0) {
                this.showModal('<p class="p-8 text-center font-bold">間違い履歴がありません。</p>');
                return;
            }
            const rows = entries.map(([idx, cnt]) => {
                const v = VERB_DATA[idx];
                return `<tr class="border-b">
                    <td class="py-2 pr-4">${v.ja}</td>
                    <td class="py-2 pr-4 text-slate-500">${v.present} - ${v.past} - ${v.pp}</td>
                    <td class="py-2 text-red-500 font-bold">${cnt}回</td>
                </tr>`;
            }).join('');
            this.showModal(`
                <h3 class="text-xl font-bold mb-4">誤答分析</h3>
                <table class="w-full text-sm">${rows}</table>
                <button onclick="quizApp.clearHistory()" class="mt-6 w-full p-3 bg-red-100 text-red-600 rounded-xl font-bold">履歴をリセット</button>
            `);
        }

        clearHistory() {
            this.history = [];
            localStorage.removeItem('verb_history_v2');
            this.closeModal();
        }

        showRanking() {
            if (this.ranking.length === 0) {
                this.showModal('<p class="p-8 text-center font-bold">記録がありません。</p>');
                return;
            }
            const rows = this.ranking.map((r, i) => {
                const pct = Math.round((r.score / r.total) * 100);
                const date = new Date(r.ts).toLocaleDateString('ja-JP');
                return `<tr class="border-b">
                    <td class="py-2 pr-3 font-bold">${i + 1}</td>
                    <td class="py-2 pr-3">${r.score} / ${r.total}</td>
                    <td class="py-2 pr-3">${pct}%</td>
                    <td class="py-2 text-slate-400 text-xs">${date}</td>
                </tr>`;
            }).join('');
            this.showModal(`
                <h3 class="text-xl font-bold mb-4">ランキング TOP10</h3>
                <table class="w-full text-sm">${rows}</table>
            `);
        }

        showVerbList() {
            const rows = VERB_DATA.map(v => `
                <tr class="border-b text-sm">
                    <td class="py-2 pr-3 text-slate-500">${v.ja}</td>
                    <td class="py-2 pr-3">${v.present}</td>
                    <td class="py-2 pr-3">${v.past}</td>
                    <td class="py-2">${v.pp}</td>
                </tr>`).join('');
            this.showModal(`
                <h3 class="text-xl font-bold mb-4">不規則動詞一覧</h3>
                <table class="w-full">
                    <thead><tr class="text-xs text-slate-400 border-b">
                        <th class="pb-2 text-left">意味</th>
                        <th class="pb-2 text-left">原形</th>
                        <th class="pb-2 text-left">過去形</th>
                        <th class="pb-2 text-left">過去分詞</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `);
        }

        showModal(html) {
            this.ui.modalContent.innerHTML = html + `<button onclick="quizApp.closeModal()" class="mt-4 w-full p-3 bg-slate-100 rounded-xl text-slate-600">閉じる</button>`;
            this.ui.modal.classList.remove('hidden');
        }

        closeModal() {
            this.ui.modal.classList.add('hidden');
        }
    }

    const quizApp = new QuizApp();
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('modal-overlay')) quizApp.closeModal();
    });
</script>

</body>
</html>
