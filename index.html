<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不規則動詞マスター made by Oikawa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; touch-action: manipulation; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .char-input {
            width: 100%;
            padding: 0.75rem 0.25rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            background: white;
            ime-mode: disabled;
        }
        .char-input:focus { border-color: #6366f1; outline: none; background: #f8fafc; }
        .correct-input { border-color: #10b981 !important; background-color: #ecfdf5; }
        .wrong-input { border-color: #ef4444 !important; background-color: #fef2f2; }

        @keyframes feedback-pop {
            0%   { transform: scale(0.5) translateY(10px); opacity: 0; }
            60%  { transform: scale(1.15) translateY(-4px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .feedback-correct { animation: feedback-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .feedback-wrong { animation: shake 0.4s ease forwards; }

        .speaker-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #e2e8f0;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
        }
        .speaker-btn:hover { background: #cbd5e1; transform: scale(1.1); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

<div id="app" class="max-w-2xl mx-auto p-4 md:p-8">
    <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-700">不規則動詞マスター</h1>
        <p class="text-slate-500 mt-2">made by OIKAWA </p>
        <div class="flex items-center justify-center gap-2 mt-2">
            <span class="text-xs bg-indigo-100 text-indigo-600 px-2 py-1 rounded">ver 1.5.0</span>
            <span class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded">Voice Support</span>
        </div>
    </header>

    <div id="sub-menu" class="space-y-4">
        <div class="flex items-center justify-between mb-4">
            <h2 id="menu-title" class="text-xl font-bold text-indigo-700">通常モード</h2>
        </div>

        <button onclick="quizApp.startFullMode()" class="w-full p-4 glass-card hover:bg-slate-50 border border-transparent transition-all text-left flex justify-between items-center group">
            <div class="font-bold text-lg">全問モード</div>
            <span class="text-slate-400 group-hover:translate-x-1 transition-transform">→</span>
        </button>

        <button onclick="quizApp.showCountDialog()" class="w-full p-4 glass-card hover:bg-slate-50 border border-transparent transition-all text-left flex justify-between items-center group">
            <div class="font-bold text-lg">問題数指定モード</div>
            <span class="text-slate-400 group-hover:translate-x-1 transition-transform">→</span>
        </button>

        <button onclick="quizApp.startMistakeMode()" class="w-full p-4 glass-card hover:bg-slate-50 border border-transparent transition-all text-left flex justify-between items-center group">
            <div class="font-bold text-lg">弱点克服モード</div>
            <span class="text-slate-400 group-hover:translate-x-1 transition-transform">→</span>
        </button>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="quizApp.showAnalysis()" class="p-4 glass-card hover:bg-red-50 border border-transparent hover:border-red-200 transition-all text-red-600 font-bold">誤答分析</button>
            <button onclick="quizApp.showRanking()" class="p-4 glass-card hover:bg-slate-50 border border-transparent hover:border-slate-300 transition-all font-bold">ランキング</button>
        </div>
        <button onclick="quizApp.showVerbList()" class="w-full p-4 glass-card hover:bg-slate-50 border border-transparent hover:border-slate-300 transition-all font-bold">不規則動詞一覧</button>

        <button id="mode-switch-btn" onclick="quizApp.toggleMode()" class="w-full mt-6 p-6 glass-card hover:bg-green-50 border-2 border-dashed border-green-200 transition-all text-left flex justify-between items-center group">
            <div>
                <div class="font-bold text-xl text-green-700">１・２年生はこちら</div>
                <div class="text-sm text-slate-500">原形と過去形のみを出題するモードへ</div>
            </div>
            <span class="text-green-500 text-2xl group-hover:translate-x-1 transition-transform">→</span>
        </button>
    </div>

    <div id="quiz-area" class="hidden glass-card p-6 shadow-xl relative">
        <div id="progress-bar" class="absolute top-0 left-0 h-1 bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
        <div class="flex justify-between items-center mb-6">
            <span id="quiz-status" class="text-sm font-medium text-slate-400">Question 1/10</span>
            <button onclick="quizApp.exitToMenu()" class="text-sm text-red-400 font-bold">終了</button>
        </div>
        <div class="text-center mb-6">
            <div id="japanese-word" class="text-4xl font-bold text-slate-700">---</div>
            <p class="text-xs text-slate-400 mt-2">1文字ずつ入力してください</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-xs font-bold text-slate-400">原形 (Present)</label>
                <div id="container-present" class="flex flex-wrap gap-1 mt-1"></div>
                <div id="ans-present" class="text-xl font-bold text-indigo-600 mt-2 min-h-[1.5rem] flex items-center"></div>
            </div>
            <div>
                <label id="label-past" class="text-xs font-bold text-slate-400">過去形 (Past)</label>
                <div id="container-past" class="flex flex-wrap gap-1 mt-1"></div>
                <div id="ans-past" class="text-xl font-bold text-indigo-600 mt-2 min-h-[1.5rem] flex items-center"></div>
                
                <div id="past2-wrapper" class="hidden mt-4">
                    <label class="text-xs font-bold text-slate-400">過去形 2つ目 (Past 2nd)</label>
                    <div id="container-past2" class="flex flex-wrap gap-1 mt-1"></div>
                    <div id="ans-past2" class="text-xl font-bold text-indigo-600 mt-2 min-h-[1.5rem] flex items-center"></div>
                </div>
            </div>
            <div id="pp-wrapper">
                <label class="text-xs font-bold text-slate-400">過去分詞形 (Past Participle)</label>
                <div id="container-pp" class="flex flex-wrap gap-1 mt-1"></div>
                <div id="ans-pp" class="text-xl font-bold text-indigo-600 mt-2 min-h-[1.5rem] flex items-center"></div>
            </div>
            
            <button id="submit-btn" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg transition-colors">回答</button>
        </div>

        <div id="feedback" class="text-center mt-4 min-h-[80px] flex flex-col items-center justify-center"></div>
    </div>

    <div id="result-area" class="hidden glass-card p-8 text-center">
        <div class="text-5xl mb-4">📊</div>
        <h2 class="text-2xl font-bold mb-2">結果発表</h2>
        <div id="score-display" class="text-4xl font-bold text-indigo-600 mb-6">0 / 0</div>
        <div id="score-message" class="text-lg text-slate-600 mb-6 px-4 py-2 bg-slate-50 rounded-lg"></div>
        <button onclick="quizApp.exitToMenu()" class="w-full py-4 bg-slate-800 text-white rounded-xl font-bold">メニューへ</button>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div id="modal-content" class="bg-white rounded-2xl w-full max-w-lg max-h-[80vh] overflow-y-auto p-6"></div>
    </div>
</div>

<script>
    const APP_VERSION = "1.5.0";
    const STORAGE_KEYS = {
        HISTORY: 'verb_master_history',
        RANKING: 'verb_master_ranking'
    };

    const VERB_DATA = [
        {ja: "落ちる", present: "fall", past: "fell", pp: "fallen"},
        {ja: "見つける", present: "find", past: "found", pp: "found"},
        {ja: "思う", present: "think", past: "thought", pp: "thought"},
        {ja: "開く・催す", present: "hold", past: "held", pp: "held"},
        {ja: "戦う", present: "fight", past: "fought", pp: "fought"},
        {ja: "歌う", present: "sing", past: "sang", pp: "sung"},
        {ja: "与える", present: "give", past: "gave", pp: "given"},
        {ja: "始める", present: "begin", past: "began", pp: "begun"},
        {ja: "見せる", present: "show", past: "showed", pp: "shown"},
        {ja: "させる", present: "let", past: "let", pp: "let"},
        {ja: "教える", present: "teach", past: "taught", pp: "taught"},
        {ja: "言う", present: "say", past: "said", pp: "said"},
        {ja: "着ている", present: "wear", past: "wore", pp: "worn"},
        {ja: "建てる", present: "build", past: "built", pp: "built"},
        {ja: "持ってくる", present: "bring", past: "brought", pp: "brought"},
        {ja: "走る", present: "run", past: "ran", pp: "run"},
        {ja: "送る", present: "send", past: "sent", pp: "sent"},
        {ja: "持っている", present: "have", past: "had", pp: "had"},
        {ja: "be 動詞", present: "be", past: "was/were", pp: "been"},
        {ja: "乗る", present: "ride", past: "rode", pp: "ridden"},
        {ja: "感じる", present: "feel", past: "felt", pp: "felt"},
        {ja: "置く", present: "put", past: "put", pp: "put"},
        {ja: "保つ", present: "keep", past: "kept", pp: "kept"},
        {ja: "書く", present: "write", past: "wrote", pp: "written"},
        {ja: "知っている", present: "know", past: "knew", pp: "known"},
        {ja: "話す", present: "speak", past: "spoke", pp: "spoken"},
        {ja: "～になる", present: "become", past: "became", pp: "become"},
        {ja: "立つ", present: "stand", past: "stood", pp: "stood"},
        {ja: "する", present: "do", past: "did", pp: "done"},
        {ja: "食べる", present: "eat", past: "ate", pp: "eaten"},
        {ja: "見える", present: "see", past: "saw", pp: "seen"},
        {ja: "得る", present: "get", past: "got", pp: "got/gotten"},
        {ja: "絵を描く", present: "draw", past: "drew", pp: "drawn"},
        {ja: "行く", present: "go", past: "went", pp: "gone"},
        {ja: "失う", present: "lose", past: "lost", pp: "lost"},
        {ja: "出発する", present: "leave", past: "left", pp: "left"},
        {ja: "来る", present: "come", past: "came", pp: "come"},
        {ja: "選ぶ", present: "choose", past: "chose", pp: "chosen"},
        {ja: "聞く", present: "hear", past: "heard", pp: "heard"},
        {ja: "理解する", present: "understand", past: "understood", pp: "understood"},
        {ja: "読む", present: "read", present_audio: "read", past: "read", past_audio: "red", pp: "read", pp_audio: "red"},
        {ja: "意味する", present: "mean", past: "meant", pp: "meant"},
        {ja: "作る", present: "make", past: "made", pp: "made"},
        {ja: "会う", present: "meet", past: "met", pp: "met"},
        {ja: "つかまえる", present: "catch", past: "caught", pp: "caught"},
        {ja: "勝つ", present: "win", past: "won", pp: "won"},
        {ja: "眠る", present: "sleep", past: "slept", pp: "slept"},
        {ja: "過ごす・費やす", present: "spend", past: "spent", pp: "spent"},
        {ja: "買う", present: "buy", past: "bought", pp: "bought"},
        {ja: "写真をとる", present: "take", past: "took", pp: "taken"},
        {ja: "飲む", present: "drink", past: "drank", pp: "drunk"},
        {ja: "切る", present: "cut", past: "cut", pp: "cut"},
        {ja: "売る", present: "sell", past: "sold", pp: "sold"},
        {ja: "話す・教える", present: "tell", past: "told", pp: "told"},
        {ja: "座る", present: "sit", past: "sat", pp: "sat"},
        {ja: "壊す", present: "break", past: "broke", pp: "broken"},
        {ja: "泳ぐ", present: "swim", past: "swam", pp: "swum"},
        {ja: "忘れる", present: "forget", past: "forgot", pp: "forgot/forgotten"},
        {ja: "飛ぶ", present: "fly", past: "flew", pp: "flown"}
    ];

    function getFullModeMessage(score) {
        if (score === 0)  return "舐めてんのか？";
        if (score <= 20)  return "チョベリバ";
        if (score <= 35)  return "全然、勉強が足りてない";
        if (score <= 46)  return "まさかこの程度で良いと思ってる？";
        if (score <= 57)  return "どうせなら全部覚えてくれよ";
        if (score === 58) return "なんで逆に一問間違えるんだよ！";
        return "遂に来たね、\"コッチ側\"に...";
    }

    class QuizApp {
        constructor() {
            this.migrateData();
            this.history = this.loadData(STORAGE_KEYS.HISTORY);
            this.ranking = this.loadData(STORAGE_KEYS.RANKING);
            
            this.currentQuiz = [];
            this.currentIndex = 0;
            this.score = 0;
            this.mode = 'normal';
            
            this.ui = {
                subMenu: document.getElementById('sub-menu'),
                menuTitle: document.getElementById('menu-title'),
                modeBtn: document.getElementById('mode-switch-btn'),
                quiz: document.getElementById('quiz-area'),
                result: document.getElementById('result-area'),
                modal: document.getElementById('modal-overlay'),
                modalContent: document.getElementById('modal-content'),
                jp: document.getElementById('japanese-word'),
                feedback: document.getElementById('feedback'),
                status: document.getElementById('quiz-status'),
                progress: document.getElementById('progress-bar'),
                score: document.getElementById('score-display'),
                message: document.getElementById('score-message'),
                submitBtn: document.getElementById('submit-btn'),
                containers: {
                    present: document.getElementById('container-present'),
                    past: document.getElementById('container-past'),
                    past2: document.getElementById('container-past2'),
                    pp: document.getElementById('container-pp')
                },
                answers: {
                    present: document.getElementById('ans-present'),
                    past: document.getElementById('ans-past'),
                    past2: document.getElementById('ans-past2'),
                    pp: document.getElementById('ans-pp')
                },
                past2Wrapper: document.getElementById('past2-wrapper'),
                ppWrapper: document.getElementById('pp-wrapper')
            };
        }

        // --- 読み上げ機能 (TTS) ---
        speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'en-US';
            uttr.rate = 0.9;
            window.speechSynthesis.speak(uttr);
        }

        // read対策：特定の活用形に応じた発音用テキストを返す
        getAudioText(verbObj, tense) {
            const audioKey = `${tense}_audio`;
            return verbObj[audioKey] || verbObj[tense];
        }

        getSpeakerHtml(verbObj, tense) {
            const text = this.getAudioText(verbObj, tense);
            return `<div class="speaker-btn" onclick="quizApp.speak('${text.replace(/'/g, "\\'")}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            </div>`;
        }

        // --- データ管理ロジック ---
        migrateData() {
            const oldKeys = ['verb_history_v3.1', 'verb_ranking_v3.1'];
            oldKeys.forEach(oldKey => {
                const oldData = localStorage.getItem(oldKey);
                if (oldData) {
                    const targetKey = oldKey.includes('history') ? STORAGE_KEYS.HISTORY : STORAGE_KEYS.RANKING;
                    const currentData = this.loadData(targetKey);
                    try {
                        const parsedOld = JSON.parse(oldData);
                        const newData = Array.isArray(parsedOld) ? [...currentData, ...parsedOld] : currentData;
                        this.saveData(targetKey, newData);
                        localStorage.removeItem(oldKey);
                    } catch (e) { console.error("Migration failed", e); }
                }
            });
        }

        loadData(key) {
            const data = localStorage.getItem(key);
            if (!data) return [];
            try {
                const parsed = JSON.parse(data);
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) { return []; }
        }

        saveData(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        // --- アプリのロジック ---
        toggleMode() {
            this.mode = (this.mode === 'normal') ? 'junior' : 'normal';
            this.updateUIForMode();
        }

        updateUIForMode() {
            if (this.mode === 'junior') {
                this.ui.menuTitle.innerText = "１・２年生モード";
                this.ui.menuTitle.className = "text-xl font-bold text-green-700";
                this.ui.modeBtn.innerHTML = `<div><div class="font-bold text-xl text-indigo-700">通常モードに戻る</div><div class="text-sm text-slate-500">過去分詞形を含む学習に復帰します</div></div><span class="text-indigo-500 text-2xl">↺</span>`;
                this.ui.modeBtn.className = "w-full mt-6 p-6 glass-card hover:bg-indigo-50 border-2 border-dashed border-indigo-200 transition-all text-left flex justify-between items-center group";
            } else {
                this.ui.menuTitle.innerText = "通常モード";
                this.ui.menuTitle.className = "text-xl font-bold text-indigo-700";
                this.ui.modeBtn.innerHTML = `<div><div class="font-bold text-xl text-green-700">１・２年生はこちら</div><div class="text-sm text-slate-500">原形と過去形のみを出題するモードへ</div></div><span class="text-green-500 text-2xl group-hover:translate-x-1 transition-transform">→</span>`;
                this.ui.modeBtn.className = "w-full mt-6 p-6 glass-card hover:bg-green-50 border-2 border-dashed border-green-200 transition-all text-left flex justify-between items-center group";
            }
        }

        createInputRow(containerId) {
            const container = this.ui.containers[containerId];
            container.innerHTML = '';
            const maxLen = 15;
            for (let i = 0; i < maxLen; i++) {
                const input = document.createElement('input');
                input.type = "text";
                input.className = "char-input w-8 md:w-10";
                input.maxLength = 1;
                input.oninput = (e) => {
                    const val = e.target.value.toLowerCase();
                    if (!/^[a-z/]$/.test(val)) { e.target.value = ''; return; }
                    if (val && i < maxLen - 1) container.children[i+1].focus();
                };
                input.onkeydown = (e) => {
                    if (e.key === 'Backspace' && !e.target.value && i > 0) container.children[i-1].focus();
                    if (e.key === 'Enter') this.handleEnter(containerId);
                };
                container.appendChild(input);
            }
        }

        handleEnter(containerId) {
            if (containerId === 'present') this.ui.containers.past.children[0].focus();
            else if (containerId === 'past') {
                if (!this.ui.past2Wrapper.classList.contains('hidden')) this.ui.containers.past2.children[0].focus();
                else if (this.mode === 'junior') this.checkAnswer();
                else this.ui.containers.pp.children[0].focus();
            } else if (containerId === 'past2') {
                if (this.mode === 'junior') this.checkAnswer();
                else this.ui.containers.pp.children[0].focus();
            } else this.checkAnswer();
        }

        getWordFromInputs(containerId) {
            return Array.from(this.ui.containers[containerId].children).map(i => i.value).join('').trim();
        }

        startFullMode() {
            const pool = [...VERB_DATA].sort(() => Math.random() - 0.5);
            this.generateQuiz(pool, pool.length);
        }

        startMistakeMode() {
            const stats = this.getMistakeStats();
            const indices = Object.keys(stats).map(Number);
            if (indices.length === 0) {
                this.showModal('<p class="p-8 text-center font-bold">間違い履歴がありません。</p>');
                return;
            }
            const pool = indices.sort((a, b) => stats[b] - stats[a]).map(idx => VERB_DATA[idx]);
            this.generateQuiz(pool, pool.length);
        }

        showCountDialog() {
            this.showModal(`
                <h3 class="text-xl font-bold mb-4">問題数指定</h3>
                <input type="number" id="quiz-count-input" value="10" min="1" max="${VERB_DATA.length}" class="w-full p-4 border-2 rounded-xl text-2xl font-bold text-center mb-4">
                <button onclick="quizApp.startCustomCount()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold text-lg">開始</button>
            `);
        }

        startCustomCount() {
            const count = parseInt(document.getElementById('quiz-count-input').value) || 10;
            this.closeModal();
            const pool = [...VERB_DATA].sort(() => Math.random() - 0.5);
            this.generateQuiz(pool, count);
        }

        getMistakeStats() {
            return this.history.filter(h => h.mode === this.mode).reduce((acc, curr) => {
                if (!curr.isCorrect) acc[curr.verbIndex] = (acc[curr.verbIndex] || 0) + 1;
                return acc;
            }, {});
        }

        generateQuiz(pool, count) {
            this.currentQuiz = pool.slice(0, count).map(v => ({
                verbIndex: VERB_DATA.findIndex(orig => orig.ja === v.ja), ...v
            }));
            this.currentIndex = 0;
            this.score = 0;
            this.ui.subMenu.classList.add('hidden');
            this.ui.quiz.classList.remove('hidden');
            this.showQuestion();
        }

        showQuestion() {
            const q = this.currentQuiz[this.currentIndex];
            this.ui.jp.innerText = q.ja;
            this.ui.feedback.innerHTML = "";
            this.ui.status.innerText = `Question ${this.currentIndex + 1} / ${this.currentQuiz.length}`;
            this.ui.progress.style.width = `${(this.currentIndex / this.currentQuiz.length) * 100}%`;
            
            Object.values(this.ui.answers).forEach(el => el.innerHTML = "");
            this.createInputRow('present');
            
            if (q.past === 'was/were') {
                this.ui.past2Wrapper.classList.remove('hidden');
                this.createInputRow('past');
                this.createInputRow('past2');
            } else {
                this.ui.past2Wrapper.classList.add('hidden');
                this.createInputRow('past');
            }

            if (this.mode === 'junior') this.ui.ppWrapper.classList.add('hidden');
            else {
                this.ui.ppWrapper.classList.remove('hidden');
                this.createInputRow('pp');
            }

            this.ui.containers.present.children[0].focus();
            this.ui.submitBtn.innerText = "回答";
            this.ui.submitBtn.onclick = () => this.checkAnswer();
        }

        checkAnswer() {
            const q = this.currentQuiz[this.currentIndex];
            const uPresent = this.getWordFromInputs('present');
            const uPast    = this.getWordFromInputs('past');
            const uPP      = this.mode === 'junior' ? "" : this.getWordFromInputs('pp');

            const check = (user, actual) => {
                const alts = actual.toLowerCase().split('/').map(s => s.trim());
                return alts.includes(user.toLowerCase());
            };

            const pOk  = check(uPresent, q.present);
            let paOk, ppOk = true;

            if (q.past === 'was/were') {
                const uPast2 = this.getWordFromInputs('past2');
                const answers = new Set([uPast.toLowerCase(), uPast2.toLowerCase()]);
                paOk = answers.has('was') && answers.has('were');
                this.colorDoubleInputs('past', 'past2', paOk, "was", "were");
            } else {
                paOk = check(uPast, q.past);
                this.colorInputs('past', paOk, q, 'past');
            }

            if (this.mode !== 'junior') {
                ppOk = check(uPP, q.pp);
                this.colorInputs('pp', ppOk, q, 'pp');
            }

            this.colorInputs('present', pOk, q, 'present');
            const allOk = pOk && paOk && ppOk;

            this.ui.feedback.innerHTML = allOk 
                ? `<span class="feedback-correct inline-block text-green-500 font-black" style="font-size:3rem;">✓ 正解！</span>`
                : `<span class="feedback-wrong inline-block text-red-500 font-black" style="font-size:3rem;">✗ 不正解</span>`;

            if (allOk) {
                this.score++;
                // 音声再生（修正後：個別の活用形に対応した発音用テキストを合成）
                const v1 = this.getAudioText(q, 'present');
                const v2 = this.getAudioText(q, 'past');
                const audioText = this.mode === 'junior' ? `${v1}, ${v2}` : `${v1}, ${v2}, ${this.getAudioText(q, 'pp')}`;
                this.speak(audioText);
            }

            this.history.push({ verbIndex: q.verbIndex, isCorrect: allOk, ts: Date.now(), mode: this.mode, v: APP_VERSION });
            this.saveData(STORAGE_KEYS.HISTORY, this.history);

            this.ui.submitBtn.innerText = this.currentIndex < this.currentQuiz.length - 1 ? "次へ →" : "結果を見る";
            this.ui.submitBtn.onclick = () => this.nextQuestion();
        }

        colorInputs(id, isOk, verbObj, tense) {
            const container = this.ui.containers[id];
            const word = verbObj[tense];
            Array.from(container.children).forEach(inp => {
                if (inp.value) inp.classList.add(isOk ? 'correct-input' : 'wrong-input');
                else if (!isOk) inp.classList.add('wrong-input');
            });
            if (!isOk) {
                this.ui.answers[id].innerHTML = `正解: ${word.replace(/\//g, ' / ')} ${this.getSpeakerHtml(verbObj, tense)}`;
            } else {
                this.ui.answers[id].innerHTML = this.getSpeakerHtml(verbObj, tense);
            }
        }

        colorDoubleInputs(id1, id2, isOk, w1, w2) {
            // was/were 専用 (現状は read 対策不要だが将来に備え構造維持)
            [id1, id2].forEach(id => {
                Array.from(this.ui.containers[id].children).forEach(inp => {
                    if (inp.value) inp.classList.add(isOk ? 'correct-input' : 'wrong-input');
                    else if (!isOk) inp.classList.add('wrong-input');
                });
            });
            if (!isOk) {
                // be動詞オブジェクトを模倣
                const dummyBe = { past: 'was', past_audio: 'was', past2: 'were', past2_audio: 'were' };
                this.ui.answers[id1].innerHTML = `正解: ${w1} ${this.getSpeakerHtml(dummyBe, 'past')}`;
                this.ui.answers[id2].innerHTML = `正解: ${w2} ${this.getSpeakerHtml(dummyBe, 'past2')}`;
            }
        }

        nextQuestion() {
            this.currentIndex++;
            if (this.currentIndex >= this.currentQuiz.length) this.showResult();
            else this.showQuestion();
        }

        showResult() {
            this.ui.quiz.classList.add('hidden');
            this.ui.result.classList.remove('hidden');
            const total = this.currentQuiz.length;
            this.ui.score.innerText = `${this.score} / ${total}`;
            this.ui.message.innerText = (this.mode === 'normal' && total === VERB_DATA.length) ? getFullModeMessage(this.score) : (this.score/total === 1 ? "満点！" : "お疲れ様でした！");
            this.ranking.push({ score: this.score, total, ts: Date.now(), mode: this.mode, v: APP_VERSION });
            this.ranking.sort((a, b) => (b.score / b.total) - (a.score / a.total));
            this.ranking = this.ranking.slice(0, 10);
            this.saveData(STORAGE_KEYS.RANKING, this.ranking);
        }

        exitToMenu() {
            this.ui.quiz.classList.add('hidden');
            this.ui.result.classList.add('hidden');
            this.ui.subMenu.classList.remove('hidden');
        }

        showAnalysis() {
            const stats = this.getMistakeStats();
            const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
            if (entries.length === 0) { this.showModal('<p class="p-8 text-center font-bold">履歴なし</p>'); return; }
            const rows = entries.map(([idx, cnt]) => {
                const v = VERB_DATA[idx];
                return `<tr class="border-b"><td class="py-2 font-bold">${v.ja}</td><td class="py-2 text-red-500 font-bold">${cnt}回</td></tr>`;
            }).join('');
            this.showModal(`<h3 class="text-xl font-bold mb-4">誤答分析</h3><table class="w-full">${rows}</table>`);
        }

        showRanking() {
            const filtered = this.ranking.filter(r => r.mode === this.mode);
            const rows = filtered.map((r, i) => `<tr class="border-b"><td class="py-2 font-bold text-indigo-500">${i+1}</td><td class="py-2 font-bold">${r.score}/${r.total}</td></tr>`).join('');
            this.showModal(`<h3 class="text-xl font-bold mb-4">ランキング</h3><table class="w-full">${rows}</table>`);
        }

        showVerbList() {
            const rows = VERB_DATA.map(v => `
                <tr class="border-b text-sm">
                    <td class="py-2 text-slate-500">${v.ja}</td>
                    <td class="py-2 font-medium">${v.present} ${this.getSpeakerHtml(v, 'present')}</td>
                    <td class="py-2 font-medium">${v.past} ${this.getSpeakerHtml(v, 'past')}</td>
                    ${this.mode === 'normal' ? `<td class="py-2 font-medium">${v.pp} ${this.getSpeakerHtml(v, 'pp')}</td>` : ''}
                </tr>`).join('');
            this.showModal(`<h3 class="text-xl font-bold mb-4">一覧</h3><table class="w-full text-left">${rows}</table>`);
        }

        showModal(html) {
            this.ui.modalContent.innerHTML = html + `<button onclick="quizApp.closeModal()" class="mt-4 w-full p-3 bg-slate-100 rounded-xl font-bold">閉じる</button>`;
            this.ui.modal.classList.remove('hidden');
        }
        closeModal() { this.ui.modal.classList.add('hidden'); }
    }

    const quizApp = new QuizApp();
    document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target === document.getElementById('modal-overlay')) quizApp.closeModal(); });
</script>
</body>
</html>
