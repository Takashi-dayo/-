<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不規則動詞マスター made by Oikawa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; touch-action: manipulation; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        /* 予測変換を物理的に回避するためのスタイル */
        .char-input {
            width: 100%;
            padding: 0.75rem 0.25rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            background: white;
            ime-mode: disabled; /* Legacy but helps on some Androids */
        }
        .char-input:focus {
            border-color: #6366f1;
            outline: none;
            background: #f8fafc;
        }
        .correct-input { border-color: #10b981 !important; background-color: #ecfdf5; }
        .wrong-input { border-color: #ef4444 !important; background-color: #fef2f2; }

        .dot-flashing {
            position: relative; width: 10px; height: 10px; border-radius: 5px;
            background-color: #6366f1; color: #6366f1;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: .5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: ''; display: inline-block; position: absolute; top: 0;
        }
        .dot-flashing::before {
            left: -15px; width: 10px; height: 10px; border-radius: 5px;
            background-color: #6366f1; color: #6366f1;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 15px; width: 10px; height: 10px; border-radius: 5px;
            background-color: #6366f1; color: #6366f1;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: #6366f1; }
            50%, 100% { background-color: #ebebef; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

<div id="app" class="max-w-2xl mx-auto p-4 md:p-8">
    <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-700">不規則動詞マスター</h1>
        <p class="text-slate-500 mt-2">made by OIKAWA</p>
    </header>

    <div id="menu" class="space-y-4">
        <button onclick="quizApp.startFullMode()" class="w-full p-4 glass-card hover:bg-indigo-50 border border-transparent hover:border-indigo-200 transition-all text-left flex justify-between items-center group">
            <div>
                <div class="font-bold text-lg">全問モード</div>
                <div class="text-sm text-slate-500">全59動詞に挑戦</div>
            </div>
            <span class="text-indigo-500 group-hover:translate-x-1 transition-transform">→</span>
        </button>

        <button onclick="quizApp.showCountDialog()" class="w-full p-4 glass-card hover:bg-indigo-50 border border-transparent hover:border-indigo-200 transition-all text-left flex justify-between items-center group">
            <div>
                <div class="font-bold text-lg">問題数指定モード</div>
                <div class="text-sm text-slate-500">任意の数だけ出題</div>
            </div>
            <span class="text-indigo-500 group-hover:translate-x-1 transition-transform">→</span>
        </button>

        <button onclick="quizApp.startMistakeMode()" class="w-full p-4 glass-card hover:bg-indigo-50 border border-transparent hover:border-indigo-200 transition-all text-left flex justify-between items-center group">
            <div>
                <div class="font-bold text-lg">弱点克服モード</div>
                <div class="text-sm text-slate-500">誤答履歴から優先出題</div>
            </div>
            <span class="text-indigo-500 group-hover:translate-x-1 transition-transform">→</span>
        </button>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="quizApp.showAnalysis()" class="p-4 glass-card hover:bg-red-50 border border-transparent hover:border-red-200 transition-all text-red-600 font-bold">誤答分析</button>
            <button onclick="quizApp.showRanking()" class="p-4 glass-card hover:bg-slate-50 border border-transparent hover:border-slate-300 transition-all font-bold">ランキング</button>
        </div>
        <button onclick="quizApp.showVerbList()" class="w-full p-4 glass-card hover:bg-slate-50 border border-transparent hover:border-slate-300 transition-all font-bold">不規則動詞一覧</button>
    </div>

    <!-- QUIZ AREA -->
    <div id="quiz-area" class="hidden glass-card p-6 shadow-xl relative">
        <div id="progress-bar" class="absolute top-0 left-0 h-1 bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
        <div class="flex justify-between items-center mb-6">
            <span id="quiz-status" class="text-sm font-medium text-slate-400">Question 1/10</span>
            <button onclick="quizApp.exitToMenu()" class="text-sm text-red-400">終了</button>
        </div>
        <div class="text-center mb-6">
            <div id="japanese-word" class="text-4xl font-bold text-slate-700">---</div>
            <p class="text-xs text-slate-400 mt-2">1文字ずつ入力してください（予測変換不可仕様）</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-xs font-bold text-slate-400">原形 (Present)</label>
                <div id="container-present" class="flex flex-wrap gap-1 mt-1"></div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400">過去形 (Past)</label>
                <div id="container-past" class="flex flex-wrap gap-1 mt-1"></div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400">過去分詞形 (Past Participle)</label>
                <div id="container-pp" class="flex flex-wrap gap-1 mt-1"></div>
            </div>
            
            <button id="submit-btn" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg">判定</button>
        </div>

        <div id="feedback" class="text-center mt-4 min-h-[40px]"></div>
        
        <div id="ai-coaching" class="hidden mt-4 p-4 bg-indigo-50 border border-indigo-100 rounded-xl">
            <div class="flex items-center gap-2 mb-2 text-indigo-700 text-sm font-bold">✨ AI解説</div>
            <div id="ai-content" class="text-sm text-slate-600 leading-relaxed"></div>
        </div>
    </div>

    <!-- RESULT AREA -->
    <div id="result-area" class="hidden glass-card p-8 text-center">
        <div class="text-5xl mb-4">📊</div>
        <h2 class="text-2xl font-bold mb-2">結果発表</h2>
        <div id="score-display" class="text-4xl font-bold text-indigo-600 mb-6">0 / 0</div>
        <div id="score-message" class="text-lg text-slate-600 mb-6 px-4 py-2 bg-slate-50 rounded-lg"></div>
        <button onclick="quizApp.exitToMenu()" class="w-full py-4 bg-slate-800 text-white rounded-xl font-bold">メニューへ</button>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div id="modal-content" class="bg-white rounded-2xl w-full max-w-lg max-h-[80vh] overflow-y-auto p-6"></div>
    </div>
</div>

<script>
    const apiKey = ""; 

    const VERB_DATA = [
        {ja: "落ちる", present: "fall", past: "fell", pp: "fallen"},
        {ja: "見つける", present: "find", past: "found", pp: "found"},
        {ja: "思う", present: "think", past: "thought", pp: "thought"},
        {ja: "開く・催す", present: "hold", past: "held", pp: "held"},
        {ja: "戦う", present: "fight", past: "fought", pp: "fought"},
        {ja: "歌う", present: "sing", past: "sang", pp: "sung"},
        {ja: "与える", present: "give", past: "gave", pp: "given"},
        {ja: "始める", present: "begin", past: "began", pp: "begun"},
        {ja: "見せる", present: "show", past: "showed", pp: "shown"},
        {ja: "させる", present: "let", past: "let", pp: "let"},
        {ja: "教える", present: "teach", past: "taught", pp: "taught"},
        {ja: "言う", present: "say", past: "said", pp: "said"},
        {ja: "着ている", present: "wear", past: "wore", pp: "worn"},
        {ja: "建てる", present: "build", past: "built", pp: "built"},
        {ja: "持ってくる", present: "bring", past: "brought", pp: "brought"},
        {ja: "走る", present: "run", past: "ran", pp: "run"},
        {ja: "送る", present: "send", past: "sent", pp: "sent"},
        {ja: "持っている", present: "have", past: "had", pp: "had"},
        {ja: "be 動詞", present: "be", past: "was/were", pp: "been"},
        {ja: "乗る", present: "ride", past: "rode", pp: "ridden"},
        {ja: "感じる", present: "feel", past: "felt", pp: "felt"},
        {ja: "置く", present: "put", past: "put", pp: "put"},
        {ja: "保つ", present: "keep", past: "kept", pp: "kept"},
        {ja: "書く", present: "write", past: "wrote", pp: "written"},
        {ja: "知っている", present: "know", past: "knew", pp: "known"},
        {ja: "話す", present: "speak", past: "spoke", pp: "spoken"},
        {ja: "～になる", present: "become", past: "became", pp: "become"},
        {ja: "立つ", present: "stand", past: "stood", pp: "stood"},
        {ja: "する", present: "do", past: "did", pp: "done"},
        {ja: "食べる", present: "eat", past: "ate", pp: "eaten"},
        {ja: "見える", present: "see", past: "saw", pp: "seen"},
        {ja: "得る", present: "get", past: "got", pp: "got"},
        {ja: "絵を描く", present: "draw", past: "drew", pp: "drawn"},
        {ja: "行く", present: "go", past: "went", pp: "gone"},
        {ja: "失う", present: "lose", past: "lost", pp: "lost"},
        {ja: "出発する", present: "leave", past: "left", pp: "left"},
        {ja: "来る", present: "come", past: "came", pp: "come"},
        {ja: "選ぶ", present: "choose", past: "chose", pp: "chosen"},
        {ja: "聞く", present: "hear", past: "heard", pp: "heard"},
        {ja: "理解する", present: "understand", past: "understood", pp: "understood"},
        {ja: "読む", present: "read", past: "read", pp: "read"},
        {ja: "意味する", present: "mean", past: "meant", pp: "meant"},
        {ja: "作る", present: "make", past: "made", pp: "made"},
        {ja: "会う", present: "meet", past: "met", pp: "met"},
        {ja: "つかまえる", present: "catch", past: "caught", pp: "caught"},
        {ja: "勝つ", present: "win", past: "won", pp: "won"},
        {ja: "眠る", present: "sleep", past: "slept", pp: "slept"},
        {ja: "過ごす・費やす", present: "spend", past: "spent", pp: "spent"},
        {ja: "買う", present: "buy", past: "bought", pp: "bought"},
        {ja: "写真をとる", present: "take", past: "took", pp: "taken"},
        {ja: "飲む", present: "drink", past: "drank", pp: "drunk"},
        {ja: "切る", present: "cut", past: "cut", pp: "cut"},
        {ja: "売る", present: "sell", past: "sold", pp: "sold"},
        {ja: "話す・教える", present: "tell", past: "told", pp: "told"},
        {ja: "座る", present: "sit", past: "sat", pp: "sat"},
        {ja: "壊す", present: "break", past: "broke", pp: "broken"},
        {ja: "泳ぐ", present: "swim", past: "swam", pp: "swum"},
        {ja: "忘れる", present: "forget", past: "forgot", pp: "forgotten"},
        {ja: "飛ぶ", present: "fly", past: "flew", pp: "flown"}
    ];

    class QuizApp {
        constructor() {
            this.history = JSON.parse(localStorage.getItem('verb_history_v2') || '[]');
            this.ranking = JSON.parse(localStorage.getItem('verb_ranking_v2') || '[]');
            this.currentQuiz = [];
            this.currentIndex = 0;
            this.score = 0;
            this.isFullMode = false;
            
            this.ui = {
                menu: document.getElementById('menu'),
                quiz: document.getElementById('quiz-area'),
                result: document.getElementById('result-area'),
                modal: document.getElementById('modal-overlay'),
                modalContent: document.getElementById('modal-content'),
                jp: document.getElementById('japanese-word'),
                feedback: document.getElementById('feedback'),
                status: document.getElementById('quiz-status'),
                progress: document.getElementById('progress-bar'),
                score: document.getElementById('score-display'),
                message: document.getElementById('score-message'),
                aiCoaching: document.getElementById('ai-coaching'),
                aiContent: document.getElementById('ai-content'),
                submitBtn: document.getElementById('submit-btn'),
                containers: {
                    present: document.getElementById('container-present'),
                    past: document.getElementById('container-past'),
                    pp: document.getElementById('container-pp')
                }
            };
        }

        async callGemini(prompt, systemInstruction) {
            if (!apiKey) return null;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (error) { return null; }
        }

        async fetchAICoaching(verb) {
            if (!apiKey) return;
            this.ui.aiCoaching.classList.remove('hidden');
            this.ui.aiContent.innerHTML = '<div class="dot-flashing mx-auto"></div>';
            const prompt = `動詞「${verb.present}」（意味: ${verb.ja}）の変化形は ${verb.present}-${verb.past}-${verb.pp}。暗記のコツを簡潔に。例文付き。`;
            const text = await this.callGemini(prompt, "英語教師ポッド。3行以内。");
            this.ui.aiContent.innerText = text || "データ取得失敗。";
        }

        // 1文字入力ボックスの生成 (予測変換遮断の核)
        createInputRow(containerId, word) {
            const container = this.ui.containers[containerId];
            container.innerHTML = '';
            
            // スラッシュがある場合は代表的な方を選択するか両方の最大長に合わせる
            // ここでは15文字分固定で用意し、入力された分だけを評価する
            const maxLen = 15; 
            for (let i = 0; i < maxLen; i++) {
                const input = document.createElement('input');
                input.type = "text";
                input.className = "char-input w-8 md:w-10";
                input.maxLength = 1;
                input.setAttribute('autocomplete', 'off');
                input.setAttribute('autocorrect', 'off');
                input.setAttribute('autocapitalize', 'none');
                input.setAttribute('spellcheck', 'false');
                input.setAttribute('inputmode', 'email'); // emailモードは予測変換が出にくい

                input.oninput = (e) => {
                    const val = e.target.value.toLowerCase();
                    if (!/^[a-z/]$/.test(val)) {
                        e.target.value = '';
                        return;
                    }
                    if (val && i < maxLen - 1) {
                        container.children[i+1].focus();
                    }
                };

                input.onkeydown = (e) => {
                    if (e.key === 'Backspace' && !e.target.value && i > 0) {
                        container.children[i-1].focus();
                    }
                    if (e.key === 'Enter') {
                        this.handleEnter(containerId);
                    }
                };
                container.appendChild(input);
            }
        }

        handleEnter(containerId) {
            if (containerId === 'present') this.ui.containers.past.children[0].focus();
            else if (containerId === 'past') this.ui.containers.pp.children[0].focus();
            else this.checkAnswer();
        }

        getWordFromInputs(containerId) {
            return Array.from(this.ui.containers[containerId].children)
                .map(i => i.value).join('').trim();
        }

        startFullMode() {
            this.isFullMode = true;
            const pool = [...VERB_DATA].sort(() => Math.random() - 0.5);
            this.generateQuiz(pool, pool.length);
        }

        showCountDialog() {
            this.showModal(`
                <h3 class="text-xl font-bold mb-4">問題数指定</h3>
                <input type="number" id="quiz-count-input" value="10" min="1" max="59" class="w-full p-4 border-2 rounded-xl text-2xl font-bold text-center mb-4">
                <button onclick="quizApp.startCustomCount()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold text-lg">開始</button>
            `);
        }

        startCustomCount() {
            const count = parseInt(document.getElementById('quiz-count-input').value) || 10;
            this.closeModal();
            this.isFullMode = false;
            const pool = [...VERB_DATA].sort(() => Math.random() - 0.5);
            this.generateQuiz(pool, count);
        }

        startMistakeMode() {
            const stats = this.getMistakeStats();
            const indices = Object.keys(stats).map(Number);
            if (indices.length === 0) {
                this.showModal('<p class="p-8 text-center font-bold">間違い履歴がありません。</p>');
                return;
            }
            this.isFullMode = false;
            const pool = indices.sort((a, b) => stats[b] - stats[a]).map(idx => VERB_DATA[idx]);
            this.generateQuiz(pool, pool.length);
        }

        getMistakeStats() {
            return this.history.reduce((acc, curr) => {
                if (!curr.isCorrect) acc[curr.verbIndex] = (acc[curr.verbIndex] || 0) + 1;
                return acc;
            }, {});
        }

        generateQuiz(pool, count) {
            this.currentQuiz = pool.slice(0, count).map(v => {
                return { verbIndex: VERB_DATA.findIndex(orig => orig.ja === v.ja), ...v };
            });
            this.currentIndex = 0;
            this.score = 0;
            this.ui.menu.classList.add('hidden');
            this.ui.quiz.classList.remove('hidden');
            this.showQuestion();
        }

        showQuestion() {
            const q = this.currentQuiz[this.currentIndex];
            this.ui.jp.innerText = q.ja;
            this.ui.aiCoaching.classList.add('hidden');
            this.ui.feedback.innerHTML = "";
            this.ui.status.innerText = `Question ${this.currentIndex + 1} / ${this.currentQuiz.length}`;
            this.ui.progress.style.width = `${(this.currentIndex / this.currentQuiz.length) * 100}%`;
            
            this.createInputRow('present', q.present);
            this.createInputRow('past', q.past);
            this.createInputRow('pp', q.pp);
            
            this.ui.containers.present.children[0].focus();
            this.ui.submitBtn.innerText = "判定";
            this.ui.submitBtn.onclick = () => this.checkAnswer();
        }

        checkAnswer() {
            const q = this.currentQuiz[this.currentIndex];
            const uPresent = this.getWordFromInputs('present');
            const uPast = this.getWordFromInputs('past');
            const uPP = this.getWordFromInputs('pp');

            const check = (user, actual) => {
                const alts = actual.toLowerCase().split('/').map(s => s.trim());
                return alts.includes(user.toLowerCase());
            };

            const isPresentOk = check(uPresent, q.present);
            const isPastOk = check(uPast, q.past);
            const isPPOk = check(uPP, q.pp);
            const isAllOk = isPresentOk && isPastOk && isPPOk;

            this.markInputs('present', isPresentOk);
            this.markInputs('past', isPastOk);
            this.markInputs('pp', isPPOk);

            this.history.unshift({ verbIndex: q.verbIndex, isCorrect: isAllOk, timestamp: Date.now() });
            localStorage.setItem('verb_history_v2', JSON.stringify(this.history.slice(0, 1000)));

            if (isAllOk) {
                this.score++;
                this.ui.feedback.innerHTML = `<div class="text-green-600 font-bold text-xl">PERFECT!</div>`;
            } else {
                this.ui.feedback.innerHTML = `<div class="text-red-500 text-sm">正解: <span class="font-bold">${q.present} - ${q.past} - ${q.pp}</span></div>`;
            }

            this.fetchAICoaching(q);
            this.ui.submitBtn.innerText = "次へ";
            this.ui.submitBtn.onclick = () => this.nextQuestion();
        }

        markInputs(type, isOk) {
            Array.from(this.ui.containers[type].children).forEach(input => {
                if (input.value) input.classList.add(isOk ? 'correct-input' : 'wrong-input');
                input.disabled = true;
            });
        }

        nextQuestion() {
            this.currentIndex++;
            if (this.currentIndex < this.currentQuiz.length) this.showQuestion();
            else this.showResult();
        }

        showResult() {
            this.ui.quiz.classList.add('hidden');
            this.ui.result.classList.remove('hidden');
            this.ui.score.innerText = `${this.score} / ${this.currentQuiz.length}`;
            
            let msg = this.score === this.currentQuiz.length ? "完璧。君こそが真のマスターだ。" : "継続的な訓練が必要だ。";
            if (this.isFullMode && this.score === 59) msg = "全問正解。人類の頂点に到達した。";
            this.ui.message.innerText = msg;
            
            if (this.isFullMode) {
                this.ranking.push({ score: this.score, date: new Date().toLocaleString() });
                this.ranking.sort((a,b) => b.score - a.score);
                this.ranking = this.ranking.slice(0, 5);
                localStorage.setItem('verb_ranking_v2', JSON.stringify(this.ranking));
            }
        }

        showAnalysis() {
            const stats = this.getMistakeStats();
            const list = Object.entries(stats).sort((a,b) => b[1]-a[1]).map(([idx, count]) => {
                const v = VERB_DATA[idx];
                return `<div class="flex justify-between border-b py-2"><span>${v.ja} (${v.present})</span><span class="text-red-500 font-bold">${count}回ミス</span></div>`;
            }).join('');
            this.showModal(`<h3 class="font-bold text-lg mb-4">誤答分析</h3><div class="space-y-1">${list || "記録なし"}</div>`);
        }

        showRanking() {
            const list = this.ranking.map((r, i) => `<div class="flex justify-between border-b py-2"><span>${i+1}位: ${r.score}点</span><span class="text-xs text-slate-400">${r.date}</span></div>`).join('');
            this.showModal(`<h3 class="font-bold text-lg mb-4">ランキング</h3><div class="space-y-1">${list || "記録なし"}</div>`);
        }

        showVerbList() {
            const list = VERB_DATA.map(v => `<div class="border-b py-2 text-sm"><span class="font-bold w-20 inline-block">${v.ja}</span> ${v.present} - ${v.past} - ${v.pp}</div>`).join('');
            this.showModal(`<h3 class="font-bold text-lg mb-4">動詞一覧</h3><div class="h-[60vh] overflow-y-auto">${list}</div>`);
        }

        showModal(html) {
            this.ui.modalContent.innerHTML = html;
            this.ui.modal.classList.remove('hidden');
        }

        closeModal() {
            this.ui.modal.classList.add('hidden');
        }

        exitToMenu() {
            this.ui.quiz.classList.add('hidden');
            this.ui.result.classList.add('hidden');
            this.ui.menu.classList.remove('hidden');
        }
    }

    const quizApp = new QuizApp();
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if(e.target.id === 'modal-overlay') quizApp.closeModal();
    });
</script>

</body>
</html>
